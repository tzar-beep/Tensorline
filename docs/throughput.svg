<circle class="mk s1" cx="520.0" cy="206.9" r="4.5"><title>Continuous batching: 557 tok/s at 64 concurrent</title></circle>
<circle class="s1" cx="534" cy="206.9" r="4"/>
<text class="ink" x="544" y="210.9" font-size="12">Continuous batching · 557</text>
<path class="ln s2" d="M64.0,296.8 L155.2,272.1 L246.4,248.7 L337.6,206.8 L428.8,148.6 L520.0,74.6"/>
