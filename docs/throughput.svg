<circle class="mk s2" cx="155.2" cy="272.1" r="4.5"><title>Batching + CUDA graphs: 212 tok/s at 4 concurrent</title></circle>
<circle class="mk s2" cx="246.4" cy="248.7" r="4.5"><title>Batching + CUDA graphs: 336 tok/s at 8 concurrent</title></circle>
<circle class="mk s2" cx="337.6" cy="206.8" r="4.5"><title>Batching + CUDA graphs: 558 tok/s at 16 concurrent</title></circle>
<circle class="mk s2" cx="428.8" cy="148.6" r="4.5"><title>Batching + CUDA graphs: 866 tok/s at 32 concurrent</title></circle>
<circle class="mk s2" cx="520.0" cy="74.6" r="4.5"><title>Batching + CUDA graphs: 1259 tok/s at 64 concurrent</title></circle>
<circle class="s2" cx="534" cy="74.6" r="4"/>
<text class="ink" x="544" y="78.6" font-size="12">Batching + CUDA graphs · 1259</text>
