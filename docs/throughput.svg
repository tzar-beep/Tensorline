<text class="ink2" x="56" y="278.3" font-size="11" text-anchor="end">200</text>
<line class="grid" x1="64" x2="520" y1="236.6" y2="236.6"/>
<text class="ink2" x="56" y="240.6" font-size="11" text-anchor="end">400</text>
<line class="grid" x1="64" x2="520" y1="198.9" y2="198.9"/>
<text class="ink2" x="56" y="202.9" font-size="11" text-anchor="end">600</text>
<line class="grid" x1="64" x2="520" y1="161.1" y2="161.1"/>
<text class="ink2" x="56" y="165.1" font-size="11" text-anchor="end">800</text>
<line class="grid" x1="64" x2="520" y1="123.4" y2="123.4"/>
<text class="ink2" x="56" y="127.4" font-size="11" text-anchor="end">1000</text>
<line class="grid" x1="64" x2="520" y1="85.7" y2="85.7"/>
<text class="ink2" x="56" y="89.7" font-size="11" text-anchor="end">1200</text>
