<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Output throughput vs concurrency</title>
<desc id="d">Qwen2.5-0.5B on an RTX 3050 laptop GPU. Naive stays near 15 tok/s; continuous batching reaches 558 tok/s at 64 concurrent requests; with CUDA graphs it reaches 1259 tok/s.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df}.s0{stroke:#2a78d6;fill:#2a78d6}.s1{stroke:#eb6834;fill:#eb6834}.s2{stroke:#1baf7a;fill:#1baf7a}.ln{fill:none;stroke-width:2}.mk{stroke:#fcfcfb;stroke-width:2}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.grid{stroke:#33332f}.mk{stroke:#1a1a19}.s0{stroke:#3987e5;fill:#3987e5}.s1{stroke:#d95926;fill:#d95926}.s2{stroke:#199e70;fill:#199e70}}</style>
<rect class="bg" width="720" height="360" rx="8"/>
<text class="ink" x="64" y="26" font-size="15" font-weight="600">Output throughput (tok/s) vs concurrent requests</text>
