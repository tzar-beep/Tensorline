<text class="ink2" x="56" y="52.0" font-size="11" text-anchor="end">1400</text>
<text class="ink2" x="64.0" y="330" font-size="11" text-anchor="middle">1</text>
<text class="ink2" x="155.2" y="330" font-size="11" text-anchor="middle">4</text>
<text class="ink2" x="246.4" y="330" font-size="11" text-anchor="middle">8</text>
<text class="ink2" x="337.6" y="330" font-size="11" text-anchor="middle">16</text>
<text class="ink2" x="428.8" y="330" font-size="11" text-anchor="middle">32</text>
<text class="ink2" x="520.0" y="330" font-size="11" text-anchor="middle">64</text>
<text class="ink2" x="292.0" y="350" font-size="11" text-anchor="middle">concurrent requests</text>
<path class="ln s0" d="M64.0,309.4 L155.2,309.2 L246.4,309.2 L337.6,309.0"/>
<circle class="mk s0" cx="64.0" cy="309.4" r="4.5"><title>Naive (Phase 1): 14 tok/s at 1 concurrent</title></circle>
<circle class="mk s0" cx="155.2" cy="309.2" r="4.5"><title>Naive (Phase 1): 15 tok/s at 4 concurrent</title></circle>
<circle class="mk s0" cx="246.4" cy="309.2" r="4.5"><title>Naive (Phase 1): 15 tok/s at 8 concurrent</title></circle>
